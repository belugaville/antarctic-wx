<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Antarctic Weather — ECMWF Forecast Maps</title>
<style>
  :root { --ice: #7fd4ff; --bg: #0b1d2a; --panel: #12293c; --text: #eaf6ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: var(--bg); color: var(--text); text-align: center; }
  header { padding: 18px 12px 6px; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: 0.5px; }
  header h1 .accent { color: var(--ice); }
  header p { margin: 4px 0 0; opacity: 0.75; font-size: 14px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 14px 10px 4px; }
  .controls button {
    background: var(--panel); color: var(--text); border: 1px solid #2c4d68;
    border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--ice); }
  .controls button.active { background: var(--ice); color: #06283d; font-weight: 600; border-color: var(--ice); }
  #map { width: min(92vw, 780px); height: auto; border-radius: 10px; margin: 12px auto 4px; display: block; background: #fff; }
  .slider-row { display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px 16px 2px; max-width: 820px; margin: 0 auto; }
  .slider-row button {
    background: var(--panel); color: var(--text); border: 1px solid #2c4d68;
    border-radius: 8px; padding: 6px 12px; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  #stepSlider { flex: 1; accent-color: var(--ice); height: 28px; }
  #stepLabel { font-size: 17px; font-weight: 600; min-height: 22px; margin-top: 4px; }
  footer { padding: 14px 12px 26px; font-size: 12.5px; opacity: 0.65; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <h1>Antarctic <span class="accent">Weather</span></h1>
  <p>ECMWF forecast maps for Antarctica</p>
</header>

<!-- Product buttons: data-product values must match your folder names -->
<div class="controls" id="productBar">
  <button data-product="t2m" class="active">2m Temperature + MSLP</button>
  <button data-product="wind">10m Wind Speed</button>
  <button data-product="windchill">Wind Chill</button>
</div>

<img id="map" src="images/ecmwf/t2m/f000.png" alt="Antarctic forecast map">
<div id="stepLabel">F000</div>

<div class="slider-row">
  <button id="prevBtn" title="Previous frame">&#9664;</button>
  <input type="range" id="stepSlider" min="0" max="4" step="1" value="0">
  <button id="nextBtn" title="Next frame">&#9654;</button>
  <button id="playBtn">Play</button>
</div>

<footer>
  Forecast data: ECMWF open data (IFS). Maps generated with Python, Cartopy and Matplotlib.<br>
  Use the slider, the arrow buttons, or your keyboard arrow keys. Press Play to animate.
</footer>

<script>
  // These lists mirror site\manifest.json.
  // (We hard-code them here because browsers block fetch() on file:// pages.
  //  Once the site is hosted online, it can read the manifest directly.)
  const STEPS = [0, 12, 24, 36, 48];
  const MODEL = "ecmwf";

  let product = "t2m";
  let idx = 0;
  let playing = false;
  let timer = null;

  const img = document.getElementById("map");
  const slider = document.getElementById("stepSlider");
  const label = document.getElementById("stepLabel");
  const playBtn = document.getElementById("playBtn");

  const pad = n => String(n).padStart(3, "0");
  const pathFor = (prod, step) => `images/${MODEL}/${prod}/f${pad(step)}.png`;

  function preload(prod) {
    // Load every frame of this product in the background,
    // so the animation doesn't stutter on first play.
    STEPS.forEach(s => { const i = new Image(); i.src = pathFor(prod, s); });
  }

  function update() {
    img.src = pathFor(product, STEPS[idx]);
    slider.value = idx;
    label.textContent = "F" + pad(STEPS[idx]);
    document.querySelectorAll("#productBar button").forEach(b =>
      b.classList.toggle("active", b.dataset.product === product));
  }

  function setStep(newIdx) {
    idx = (newIdx + STEPS.length) % STEPS.length;  // wrap around at the ends
    update();
  }

  function pause() {
    playing = false;
    clearInterval(timer);
    playBtn.textContent = "Play";
  }

  function play() {
    playing = true;
    playBtn.textContent = "Pause";
    timer = setInterval(() => setStep(idx + 1), 800);
  }

  document.querySelectorAll("#productBar button").forEach(b =>
    b.addEventListener("click", () => { product = b.dataset.product; preload(product); update(); }));

  slider.addEventListener("input", () => { pause(); idx = Number(slider.value); update(); });
  document.getElementById("prevBtn").addEventListener("click", () => { pause(); setStep(idx - 1); });
  document.getElementById("nextBtn").addEventListener("click", () => { pause(); setStep(idx + 1); });
  playBtn.addEventListener("click", () => playing ? pause() : play());
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { pause(); setStep(idx + 1); }
    if (e.key === "ArrowLeft")  { pause(); setStep(idx - 1); }
  });

  preload(product);
  update();
</script>
</body>
</html>
